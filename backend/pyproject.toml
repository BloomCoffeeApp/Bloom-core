[project]
name = "bloom"
version = "1.0.0"
description = "Gestión integral para cafeterías: POS, stock, compras, clientes y asistente de barista."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
# Plain uvicorn (not [standard]): the desktop app serves HTTP/1.1 to one local window, so h11 is
# enough; httptools/websockets/PyYAML/python-dotenv only made the installer bigger.
dependencies = [
  "fastapi", "uvicorn", "sqlalchemy>=2.0", "alembic", "pydantic>=2", "argon2-cffi", "cryptography",
  "openpyxl", "pillow", "pywebview", "qrcode[pil]", "tzdata", "holidays",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The package is `app`; `migrations/` and `tests/` live next to it and are not part of it. Without this, a fresh clone
# fails `pip install -e .` ("Multiple top-level packages discovered in a flat-layout").
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
# watchfiles: `uvicorn --reload` in scripts/dev.ps1.
dev = ["pytest", "httpx", "hypothesis", "pyinstaller", "watchfiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
